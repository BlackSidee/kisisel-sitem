<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- Koyu renkli, köşeleri yuvarlatılmış kare arka plan -->
    <rect width="64" height="64" rx="14" fill="#121212" />
    
    <!-- Tam merkeze hizalanmış ikonik <T/> logosu -->
    <text x="32" y="44" font-size="32" font-weight="900" text-anchor="middle">
        <tspan fill="#00e5ff" font-family="monospace">&lt;</tspan>
        <tspan fill="#e0e0e0" font-family="Arial, sans-serif">T</tspan>
        <tspan fill="#00e5ff" font-family="monospace">/&gt;</tspan>
    </text>
</svg>
