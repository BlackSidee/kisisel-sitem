<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçerik Detayı | TahaDEV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detay-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 2rem;
            background-color: #1a1a1a;
            border-radius: 10px;
            color: #e0e0e0;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.1);
        }
        .detay-baslik {
            color: #00e5ff;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .detay-resim {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 2rem;
            background-color: #121212;
        }
        .detay-metin {
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap; 
        }
        .geri-btn {
            display: inline-block;
            margin-bottom: 2rem;
            color: #00e5ff;
            text-decoration: none;
            border: 1px solid #00e5ff;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: 0.3s;
        }
        .geri-btn:hover {
            background-color: #00e5ff;
            color: #121212;
        }

        /* --- MOBİL UYUMLULUK --- */
        @media screen and (max-width: 768px) {
            .detay-container {
                margin: 2rem 1rem;
                padding: 1.5rem;
            }
            .detay-baslik {
                font-size: 1.8rem;
            }
            .detay-metin {
                font-size: 1rem;
            }
            .detay-resim {
                max-height: 250px;
            }
        }
    </style>
</head>
<body style="background-color: #121212;">

    <div id="loading-screen">
        <div class="loader-content">
            <svg width="165" height="35" viewBox="0 0 165 35" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="26" font-family="monospace" font-size="28" font-weight="bold" fill="#00e5ff">&lt;</text>
                <text x="22" y="25" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#e0e0e0" letter-spacing="1">Taha</text>
                <text x="76" y="25" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#00e5ff" letter-spacing="1">DEV</text>
                <text x="130" y="26" font-family="monospace" font-size="28" font-weight="bold" fill="#00e5ff">/&gt;</text>
            </svg>
            <div class="spinner"></div>
        </div>
    </div>

    <div class="detay-container">
        <a href="/" class="geri-btn">← Ana Sayfaya Dön</a>
        
        <h1 id="icerik-baslik" class="detay-baslik">Yükleniyor...</h1>
        <img id="icerik-resim" class="detay-resim" src="" style="display: none;">
        <video id="icerik-video" class="detay-resim" controls controlsList="nodownload" oncontextmenu="return false;" style="display: none;">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
        <div id="icerik-metin" class="detay-metin"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Sadece bu satır ziyaretçiyi sisteme dahil etmeye yeter!
    </script>

    <script src="js/detay.js"></script>
</body>
</html>
